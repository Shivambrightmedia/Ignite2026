<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ignite 2026 - Live Event</title>
    <!-- Premium Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        /* 
           PREMIUM DESIGN SETTINGS
        */
        :root {
            --bg-color: #000000;
            --overlay-bg: rgba(255, 255, 255, 0.1);
            --text-color: #E8BA65;
            --accent-color: #ff5722;

            /* LOGO ADJUSTMENT (MAIN PAGES) */
            --logo-top: 16%;
            --logo-left: -0.5%;
            --logo-width: 940px;

            /* LOGO ADJUSTMENT (LIVE STREAM PAGE) */
            --logo-stream-top: 6%;
            --logo-stream-left: 0%;
            --logo-stream-width: 444px;

            --logo-opacity: 1;

            /* TEXT ADJUSTMENT (MAIN PAGES) */
            --text-top: 54%;
            --text-left: 94.5%;
            --text-size: 3.9rem;

            /* 
               MOBILE ADJUSTMENTS 
            */
            --mobile-logo-top: 25%;
            --mobile-logo-width: 80%;
            --mobile-text-top: 65%;
            --mobile-text-size: 1.8rem;

            /* 
               ADJUST VIDEO POSITIONING HERE 
            */
            --video-top: 22.5%;
            --video-left: 15%;
            --video-width: 70%;
            --video-height: 75.5%;

            /* Aspect ratio padding */
            --aspect-ratio-padding: 56.25%;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Outfit', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Main container */
        .event-wrapper {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-color);
        }

        .background-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background-image: url('Images/Event will start 3pm.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: background-image 0.5s ease-in-out;
        }

        /* Video Overlay */
        .video-overlay {
            position: absolute;
            top: var(--video-top);
            left: var(--video-left);
            width: var(--video-width);
            height: var(--video-height);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            z-index: 5;
        }

        .branding-overlay {
            position: absolute;
            top: var(--logo-top);
            left: var(--logo-left);
            width: 100%;
            display: flex;
            justify-content: center;
            z-index: 10;
        }

        .branding-overlay.live-mode {
            top: var(--logo-stream-top);
            left: var(--logo-stream-left);
        }

        .event-logo {
            width: auto;
            max-width: var(--logo-width);
            height: auto;
            max-height: 250px;
            opacity: var(--logo-opacity);
            filter: drop-shadow(0 0 20px rgba(0, 0, 0, 0.5));
            transition: max-width 0.1s;
        }

        .branding-overlay.live-mode .event-logo {
            max-width: var(--logo-stream-width);
        }

        .status-content {
            position: absolute;
            top: var(--text-top);
            left: var(--text-left);
            transform: translate(-50%, -50%);
            width: 90%;
            text-align: center;
            z-index: 8;
        }

        .status-text {
            font-size: var(--text-size);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            line-height: 1.2;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);
            animation: fadeInOut 2s infinite alternate;
        }

        @keyframes fadeInOut {
            from { opacity: 0.8; transform: translate(-50%, -50%) scale(0.98); }
            to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }

        /* 
           MOBILE RESPONSIVENESS 
        */
        @media (max-width: 768px) {
            #mainBg {
                background-image: url('Images/1920x1080.png') !important;
                background-size: contain;
                background-position: center;
            }
            .branding-overlay {
                top: var(--mobile-logo-top) !important;
                left: 0 !important;
            }
            .event-logo {
                max-width: var(--mobile-logo-width) !important;
                max-height: 180px;
            }
            .status-content {
                top: var(--mobile-text-top) !important;
                left: 50% !important;
            }
            .status-text {
                font-size: var(--mobile-text-size) !important;
            }
            .video-overlay {
                top: 40% !important;
                left: 5% !important;
                width: 90% !important;
                height: auto !important;
                aspect-ratio: 16/9;
            }
        }
    </style>
</head>

<body>
    <div class="event-wrapper" id="appWrapper" style="display: none;">
        <div id="mainBg" class="background-container">
            <div class="branding-overlay">
                <img src="Images/Truhome finance ignite logo.png" class="event-logo" alt="Ignite 2026">
            </div>
            <div id="statusContent" class="status-content">
                <h1 id="statusText" class="status-text">EVENT WILL START @3:00PM ON 11TH APRIL, 2026</h1>
            </div>
            <div id="videoContainer" class="video-overlay"></div>
        </div>
    </div>

    <script type="module">
        /**
         * VISUAL ADJUSTER - MOBILE & DESKTOP AWARE
         */
        let logoTop = 16; let logoWidth = 940; 
        let mLogoTop = 25; let mLogoWidth = 80;

        window.addEventListener('keydown', (e) => {
            const isMobile = window.innerWidth <= 768;
            const step = e.shiftKey ? 2 : 0.5;

            if (isMobile) {
                if (e.code === 'KeyW') mLogoTop -= step;
                if (e.code === 'KeyS') mLogoTop += step;
                if (e.key === '9') mLogoWidth -= 2;
                if (e.key === '0') mLogoWidth += 2;
                document.documentElement.style.setProperty('--mobile-logo-top', mLogoTop + '%');
                document.documentElement.style.setProperty('--mobile-logo-width', mLogoWidth + '%');
                console.log(`MOBILE LOGO: --mobile-logo-top: ${mLogoTop}%; --mobile-logo-width: ${mLogoWidth}%;`);
            } else {
                if (e.code === 'KeyW') logoTop -= step;
                if (e.code === 'KeyS') logoTop += step;
                if (e.key === '9') logoWidth -= 10;
                if (e.key === '0') logoWidth += 10;
                document.documentElement.style.setProperty('--logo-top', logoTop + '%');
                document.documentElement.style.setProperty('--logo-width', logoWidth + 'px');
                console.log(`DESKTOP LOGO: --logo-top: ${logoTop}%; --logo-width: ${logoWidth}px;`);
            }
        });

        const mainBg = document.getElementById('mainBg');
        const videoContainer = document.getElementById('videoContainer');
        const statusText = document.getElementById('statusText');
        const statusContent = document.getElementById('statusContent');
        const brandingOverlay = document.querySelector('.branding-overlay');

        function loadVideo(videoId) {
            if (!videoId) return;
            const iframe = document.createElement('iframe');
            const isEvent = videoId.toString().length < 9;
            const embedUrl = isEvent
                ? `https://vimeo.com/event/${videoId}/embed/interaction`
                : `https://player.vimeo.com/video/${videoId}?autoplay=1&title=0&byline=0&portrait=0`;
            iframe.src = embedUrl;
            iframe.allow = "autoplay; fullscreen; picture-in-picture; encrypted-media; web-share";
            iframe.style.width = '100%'; iframe.style.height = '100%'; iframe.style.border = 'none';
            videoContainer.innerHTML = ''; videoContainer.appendChild(iframe);
            statusContent.style.display = 'none';
        }

        function showWaitingScreen() {
            mainBg.style.backgroundImage = "url('Images/Event will start 3pm.png')";
            videoContainer.innerHTML = ''; statusContent.style.display = 'block';
            brandingOverlay.style.display = 'flex'; brandingOverlay.classList.remove('live-mode');
            statusText.innerText = "EVENT WILL START @3:00PM ON 11TH APRIL, 2026";
        }

        function startLive(videoId) {
            mainBg.style.backgroundImage = "url('Images/videostream.png')";
            statusContent.style.display = 'none'; brandingOverlay.style.display = 'flex';
            brandingOverlay.classList.add('live-mode'); loadVideo(videoId);
        }

        function showThankYou() {
            mainBg.style.backgroundImage = "url('Images/thankyou for watching.png')";
            videoContainer.innerHTML = ''; statusContent.style.display = 'block';
            brandingOverlay.style.display = 'flex'; brandingOverlay.classList.remove('live-mode');
            statusText.innerText = "THANK YOU FOR WATCHING";
        }

        function showResumeScreen() {
            mainBg.style.backgroundImage = "url('Images/Stream will resume in 30 mins.png')";
            videoContainer.innerHTML = ''; statusContent.style.display = 'block';
            brandingOverlay.style.display = 'flex'; brandingOverlay.classList.remove('live-mode');
            statusText.innerText = "STREAMING WILL RESUME IN 30 MINS";
        }

        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB5tWsfjCTbh1KO5X2xZQeX2SwTZ9dJcs8",
            authDomain: "ignite2026-bf820.firebaseapp.com",
            databaseURL: "https://ignite2026-bf820-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "ignite2026-bf820",
            storageBucket: "ignite2026-bf820.firebasestorage.app",
            messagingSenderId: "301380534120",
            appId: "1:301380534120:web:0acad3ac76d4523d7a20dd"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const statusRef = ref(db, 'event/status');

        let currentStatus = null;
        onValue(statusRef, (snapshot) => {
            const data = snapshot.val();
            if (!data) return;
            document.getElementById('appWrapper').style.display = 'flex';
            if (data.status !== currentStatus) {
                currentStatus = data.status;
                if (data.status === 'live') startLive(data.videoId);
                else if (data.status === 'resume') showResumeScreen();
                else if (data.status === 'thanks') showThankYou();
                else showWaitingScreen();
            }
        });
    </script>
</body>
</html>
