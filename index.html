<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ignite 2026 - Live Event</title>
    <!-- Premium Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #E8BA65;
            
            /* --- DESKTOP VARIABLES (LOCKED) --- */
            --logo-top: 16%;
            --logo-left: -0.5%;
            --logo-width: 940px;
            
            --logo-stream-top: 6%;
            --logo-stream-left: 0%;
            --logo-stream-width: 444px;

            --text-top: 54%;
            --text-left: 50%;
            --text-size: 3.5rem;


            --video-top: 22.5%;
            --video-left: 15%;
            --video-width: 70%;
            --video-height: 75.5%;

            /* --- MOBILE VARIABLES (ISOLATED) --- */
            --m-logo-top: 25%;
            --m-logo-width: 80%;
            --m-text-top: 65%;
            --m-text-size: 1.2rem;

            --m-video-top: 40%;
            --m-video-left: 5%;
            --m-video-width: 90%;
            --m-video-height: 25%;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--bg-color); font-family: 'Outfit', sans-serif; overflow: hidden; }

        .background-container {
            position: relative; width: 100vw; height: 100vh;
            background-size: cover; background-position: center; transition: background-image 0.5s;
        }

        /* Desktop Layout */
        .branding-overlay {
            position: absolute; top: var(--logo-top); left: var(--logo-left);
            width: 100%; display: flex; justify-content: center; z-index: 10;
        }
        .branding-overlay.live-mode { top: var(--logo-stream-top); left: var(--logo-stream-left); }
        .event-logo { width: auto; max-width: var(--logo-width); height: auto; max-height: 250px; }
        .branding-overlay.live-mode .event-logo { max-width: var(--logo-stream-width); }

        .status-content {
            position: absolute; 
            top: var(--text-top); 
            left: var(--text-left);
            transform: translate(-50%, -50%); 
            width: auto; 
            text-align: center; 
            z-index: 8;
            white-space: nowrap;
        }



        .status-text {
            font-size: var(--text-size); color: var(--text-color); font-weight: 700;
            text-transform: uppercase; letter-spacing: 2px;
        }


        .video-overlay {
            position: absolute; top: var(--video-top); left: var(--video-left);
            width: var(--video-width); height: var(--video-height); z-index: 5;
        }


        /* --- MOBILE MODE (Completely Separate) --- */
        @media (max-width: 768px) {
            #mainBg { 
                background-image: url('Images/1920x1080.png') !important; 
                background-size: cover; 
                background-position: center top;
            }
            .branding-overlay { top: var(--m-logo-top) !important; left: 0 !important; }
            .event-logo { max-width: var(--m-logo-width) !important; max-height: 150px; }
            .status-content { top: var(--m-text-top) !important; left: 0 !important; width: 100% !important; transform: translateY(-50%) !important; }
            .status-text { 
                font-size: var(--m-text-size) !important; 
                white-space: normal !important; 
                line-height: 1.6 !important;
                letter-spacing: 1px !important;
            }

            .video-overlay { top: var(--m-video-top) !important; left: var(--m-video-left) !important; width: var(--m-video-width) !important; height: var(--m-video-height) !important; }
        }
    </style>
</head>

<body>
    <div id="appWrapper" style="display: none;">
        <div id="mainBg" class="background-container">
            <div class="branding-overlay" id="logoWrap">
                <img src="Images/Truhome finance ignite logo.png" class="event-logo" alt="Ignite 2026">
            </div>
            <div id="statusContent" class="status-content">
                <h1 id="statusText" class="status-text">EVENT WILL START @3:00PM ON 11TH APRIL, 2026</h1>
            </div>
            <div id="videoContainer" class="video-overlay"></div>
        </div>
    </div>

    <script type="module">
        // Adjusted values saved in local state
        let desktop = { lTop: 16, lWidth: 940, tTop: 54, tLeft: 94.5, tSize: 3.9 };
        let mobile = { lTop: 25, lWidth: 80, tTop: 65, tSize: 1.8 };

        window.addEventListener('keydown', (e) => {
            const isMob = window.innerWidth <= 768;
            const p = isMob ? mobile : desktop;
            const pre = isMob ? '--m-' : '--';
            const s = e.shiftKey ? 2 : 0.5;

            if (e.code === 'KeyW') p.lTop -= s; if (e.code === 'KeyS') p.lTop += s;
            if (e.key === '9') p.lWidth -= (isMob ? 2 : 10); if (e.key === '0') p.lWidth += (isMob ? 2 : 10);
            if (e.key === 'ArrowUp') p.tTop -= s; if (e.key === 'ArrowDown') p.tTop += s;

            const root = document.documentElement;
            root.style.setProperty(`${pre}logo-top`, p.lTop + '%');
            root.style.setProperty(`${pre}logo-width`, p.lWidth + (isMob ? '%' : 'px'));
            root.style.setProperty(`${pre}text-top`, p.tTop + '%');
            console.log(`${isMob ? 'MOBILE' : 'DESKTOP'} UPDATE:`, p);
        });

        const mainBg = document.getElementById('mainBg');
        const videoContainer = document.getElementById('videoContainer');
        const statusText = document.getElementById('statusText');
        const statusContent = document.getElementById('statusContent');
        const logoWrap = document.getElementById('logoWrap');

        function loadVideo(id) {
            const isEv = id.toString().length < 9;
            const url = isEv ? `https://vimeo.com/event/${id}/embed/interaction` : `https://player.vimeo.com/video/${id}?autoplay=1&title=0&byline=0&portrait=0`;
            videoContainer.innerHTML = `<iframe src="${url}" allow="autoplay; fullscreen; picture-in-picture; encrypted-media; web-share" style="width:100%;height:100%;border:none;"></iframe>`;
        }

        function showWaiting() {
            mainBg.style.backgroundImage = "url('Images/Event will start 3pm.png')";
            statusContent.style.display = 'block'; logoWrap.classList.remove('live-mode'); videoContainer.innerHTML = '';
            statusText.innerText = "EVENT WILL START @3:00PM ON 11TH APRIL, 2026";
        }

        function startLive(id) {
            mainBg.style.backgroundImage = "url('Images/videostream.png')";
            statusContent.style.display = 'none'; logoWrap.classList.add('live-mode'); loadVideo(id);
        }

        function showThanks() {
            mainBg.style.backgroundImage = "url('Images/thankyou for watching.png')";
            statusContent.style.display = 'block'; logoWrap.classList.remove('live-mode'); videoContainer.innerHTML = '';
            statusText.innerText = "THANK YOU FOR WATCHING";
        }

        function showResume() {
            mainBg.style.backgroundImage = "url('Images/Stream will resume in 30 mins.png')";
            statusContent.style.display = 'block'; logoWrap.classList.remove('live-mode'); videoContainer.innerHTML = '';
            statusText.innerText = "STREAMING WILL RESUME IN 30 MINS";
        }

        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB5tWsfjCTbh1KO5X2xZQeX2SwTZ9dJcs8",
            authDomain: "ignite2026-bf820.firebaseapp.com",
            databaseURL: "https://ignite2026-bf820-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "ignite2026-bf820",
            storageBucket: "ignite2026-bf820.firebasestorage.app"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const statusRef = ref(db, 'event/status');

        let curStatus = null;
        onValue(statusRef, (s) => {
            const d = s.val(); if (!d) return;
            document.getElementById('appWrapper').style.display = 'flex';
            if (d.status !== curStatus) {
                curStatus = d.status;
                if (d.status === 'live') startLive(d.videoId);
                else if (d.status === 'resume') showResume();
                else if (d.status === 'thanks') showThanks();
                else showWaiting();
            }
        });
    </script>
</body>
</html>
