<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ignite 2026 - Live Event</title>
    <!-- Premium Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        /* 
           PREMIUM DESIGN SETTINGS
        */
        :root {
            --bg-color: #000000;
            --overlay-bg: rgba(255, 255, 255, 0.1);
            --text-color: #ffffff;
            --accent-color: #ff5722;

            /* LOGO ADJUSTMENT (MAIN PAGES) */
            --logo-top: 16%;
            --logo-left: -0.5%;
            --logo-width: 940px;

            /* LOGO ADJUSTMENT (LIVE STREAM PAGE) */
            --logo-stream-top: 2%;
            --logo-stream-left: 0%;
            --logo-stream-width: 740px;

            --logo-opacity: 1;

            /* TEXT ADJUSTMENT (MAIN PAGES) */
            --text-top: 54%;
            --text-left: 94.5%;
            --text-size: 3.9rem;

            /* 
               ADJUST VIDEO POSITIONING HERE 
               Values are in % relative to the background image
            */
            --video-top: 25.5%;
            /* Adjust this to move video up/down */
            --video-left: 20.8%;
            /* Adjust this to move video left/right */
            --video-width: 58.4%;
            /* Adjust this for video width */
            --video-height: 48.2%;
            /* Adjust this for video height */

            /* Aspect ratio of your background image (Background Width / Background Height) */
            /* Defaulting to 16:9 (100 / 56.25) */
            --aspect-ratio-padding: 56.25%;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Outfit', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Main container that holds everything */
        .event-wrapper {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-color);
        }

        .background-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background-image: url('Images/Event will start 3pm.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: background-image 0.5s ease-in-out;
        }

        /* 
           Video Overlay Container
           This is positioned absolutely on top of the placeholder area.
        */
        .video-overlay {
            position: absolute;
            top: var(--video-top);
            left: var(--video-left);
            width: var(--video-width);
            height: var(--video-height);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            z-index: 5;
        }

        /* Branding and Text Styles */
        .branding-overlay {
            position: absolute;
            top: var(--logo-top);
            left: var(--logo-left);
            width: 100%;
            display: flex;
            justify-content: center;
            z-index: 10;
        }

        .branding-overlay.live-mode {
            top: var(--logo-stream-top);
            left: var(--logo-stream-left);
        }

        .event-logo {
            width: auto;
            max-width: var(--logo-width);
            height: auto;
            max-height: 200px;
            opacity: var(--logo-opacity);
            filter: drop-shadow(0 0 20px rgba(0, 0, 0, 0.5));
            transition: max-width 0.1s;
        }

        .branding-overlay.live-mode .event-logo {
            max-width: var(--logo-stream-width);
        }

        .status-content {
            position: absolute;
            top: var(--text-top);
            left: var(--text-left);
            transform: translate(-50%, -50%);
            width: 90%;
            text-align: center;
            z-index: 8;
        }

        .status-text {
            font-size: var(--text-size);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            line-height: 1.2;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);
            animation: fadeInOut 2s infinite alternate;
        }

        @keyframes fadeInOut {
            from {
                opacity: 0.8;
                transform: translate(-50%, -50%) scale(0.98);
            }

            to {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }

        @media (max-width: 768px) {
            .event-logo {
                max-width: 250px;
            }

            .status-text {
                font-size: 1.5rem;
            }
        }
    </style>
</head>

<body>

    <div class="event-wrapper" id="appWrapper" style="display: none;">
        <div id="mainBg" class="background-container">
            <!-- Branding Overlay -->
            <div class="branding-overlay">
                <img src="Images/Truhome finance ignite logo.png" class="event-logo" alt="Ignite 2026">
            </div>

            <!-- Content Area (Center) -->
            <div id="statusContent" class="status-content">
                <h1 id="statusText" class="status-text">EVENT WILL START @3:00PM ON 11TH APRIL, 2026</h1>
            </div>

            <!-- Video Overlay -->
            <div id="videoContainer" class="video-overlay">
            </div>
        </div>
    </div>

    <script type="module">
        const mainBg = document.getElementById('mainBg');
        const videoContainer = document.getElementById('videoContainer');
        const statusText = document.getElementById('statusText');
        const statusContent = document.getElementById('statusContent');
        const brandingOverlay = document.querySelector('.branding-overlay');


        /**
         * Loads a Vimeo video into the placeholder area
         * @param {string} videoId - The Vimeo video ID
         */
        function loadVideo(videoId) {
            if (!videoId) return;

            const iframe = document.createElement('iframe');
            iframe.src = `https://player.vimeo.com/video/${videoId}?autoplay=1&title=0&byline=0&portrait=0`;
            iframe.allow = "autoplay; fullscreen; picture-in-picture";
            iframe.style.width = '100%';
            iframe.style.height = '100%';
            iframe.style.border = 'none';

            // Clear placeholder and add iframe
            videoContainer.innerHTML = '';
            videoContainer.appendChild(iframe);

            // Hide status text when video is live
            statusContent.style.display = 'none';
        }

        /**
         * Switches to the waiting screen
         */
        function showWaitingScreen() {
            mainBg.style.backgroundImage = "url('Images/Event will start 3pm.png')";
            videoContainer.innerHTML = '';
            statusContent.style.display = 'block';
            brandingOverlay.style.display = 'flex';
            brandingOverlay.classList.remove('live-mode');
            statusText.innerText = "EVENT WILL START @3:00PM ON 11TH APRIL, 2026";
        }

        /**
         * Starts the live stream and switches to the live background
         * @param {string} videoId 
         */
        function startLive(videoId) {
            mainBg.style.backgroundImage = "url('Images/videostream.png')";
            statusContent.style.display = 'none';
            brandingOverlay.style.display = 'flex';
            brandingOverlay.classList.add('live-mode');
            loadVideo(videoId);
        }

        /**
         * Switches to the thank you screen
         */
        function showThankYou() {
            mainBg.style.backgroundImage = "url('Images/thankyou for watching.png')";
            videoContainer.innerHTML = '';
            statusContent.style.display = 'block';
            brandingOverlay.style.display = 'flex';
            brandingOverlay.classList.remove('live-mode');
            statusText.innerText = "THANK YOU FOR WATCHING";
        }

        /**
         * Switches to the pause/resume screen
         */
        function showResumeScreen() {
            mainBg.style.backgroundImage = "url('Images/Stream will resume in 30 mins.png')";
            videoContainer.innerHTML = '';
            statusContent.style.display = 'block';
            brandingOverlay.style.display = 'flex';
            brandingOverlay.classList.remove('live-mode');
            statusText.innerText = "STREAMING WILL RESUME IN 30 MINS";
        }

        /**
         * VISUAL ADJUSTER - STATE AWARE
         */
        let lTop = 16; let lLeft = -0.5; let lWidth = 940; // Main Logo
        let tTop = 54; let tLeft = 94.5; let tSize = 3.9;  // Text

        // Video Controls (Match your CSS defaults)
        let vTop = 25; let vLeft = 15; let vWidth = 70; let vHeight = 60;

        window.addEventListener('keydown', (e) => {
            const step = e.shiftKey ? 2 : 0.5; // Hold Shift to move faster!
            const isLive = currentStatus === 'live';

            if (isLive) {
                // Adjust VIDEO with Arrows + W/A/S/D
                if (e.key === 'ArrowUp') vTop -= step;
                if (e.key === 'ArrowDown') vTop += step;
                if (e.key === 'ArrowLeft') vLeft -= step;
                if (e.key === 'ArrowRight') vLeft += step;

                if (e.code === 'KeyW') vHeight -= step;
                if (e.code === 'KeyS') vHeight += step;
                if (e.code === 'KeyA') vWidth -= step;
                if (e.code === 'KeyD') vWidth += step;

                document.documentElement.style.setProperty('--video-top', vTop + '%');
                document.documentElement.style.setProperty('--video-left', vLeft + '%');
                document.documentElement.style.setProperty('--video-width', vWidth + '%');
                document.documentElement.style.setProperty('--video-height', vHeight + '%');
            } else {
                // Adjust MAIN Logo with W/A/S/D + 9/0 (Keep 9/0 for Logo sizing)
                if (e.code === 'KeyW') lTop -= step;
                if (e.code === 'KeyS') lTop += step;
                if (e.code === 'KeyA') lLeft -= step;
                if (e.code === 'KeyD') lLeft += step;
                if (e.key === '9') lWidth -= 10;
                if (e.key === '0') lWidth += 10;

                // Adjust TEXT with Arrows + 1/2
                if (e.key === 'ArrowUp') tTop -= step;
                if (e.key === 'ArrowDown') tTop += step;
                if (e.key === 'ArrowLeft') tLeft -= step;
                if (e.key === 'ArrowRight') tLeft += step;
                if (e.key === '1') tSize -= 0.1;
                if (e.key === '2') tSize += 0.1;

                document.documentElement.style.setProperty('--logo-top', lTop + '%');
                document.documentElement.style.setProperty('--logo-left', lLeft + '%');
                document.documentElement.style.setProperty('--logo-width', lWidth + 'px');
                document.documentElement.style.setProperty('--text-top', tTop + '%');
                document.documentElement.style.setProperty('--text-left', tLeft + '%');
                document.documentElement.style.setProperty('--text-size', tSize + 'rem');
            }

            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', '1', '2', 'KeyW', 'KeyS', 'KeyA', 'KeyD', '9', '0'].includes(e.key) || e.code.startsWith('Key')) {
                console.clear();
                console.log(`%c CURRENT CONFIG (${currentStatus.toUpperCase()} MODE):`, 'color: #ff5722; font-weight: bold; font-size: 14px;');
                if (isLive) {
                    console.log(`%c VIDEO PLAYER:`, 'color: #fff; font-weight: bold;');
                    console.log(`--video-top: ${vTop}%;\n--video-left: ${vLeft}%;\n--video-width: ${vWidth}%;\n--video-height: ${vHeight}%;`);
                } else {
                    console.log(`%c LOGO:`, 'color: #fff; font-weight: bold;');
                    console.log(`--logo-top: ${lTop}%;\n--logo-left: ${lLeft}%;\n--logo-width: ${lWidth}px;`);
                    console.log(`%c TEXT:`, 'color: #fff; font-weight: bold;');
                    console.log(`--text-top: ${tTop}%;\n--text-left: ${tLeft}%;\n--text-size: ${tSize.toFixed(1)}rem;`);
                }
            }
        });

        /**
         * FIREBASE REAL-TIME INTEGRATION
         */
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB5tWsfjCTbh1KO5X2xZQeX2SwTZ9dJcs8",
            authDomain: "ignite2026-bf820.firebaseapp.com",
            databaseURL: "https://ignite2026-bf820-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "ignite2026-bf820",
            storageBucket: "ignite2026-bf820.firebasestorage.app",
            messagingSenderId: "301380534120",
            appId: "1:301380534120:web:0acad3ac76d4523d7a20dd"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const statusRef = ref(db, 'event/status');

        let currentStatus = null;

        onValue(statusRef, (snapshot) => {
            const data = snapshot.val();
            if (!data) return;

            // Show app once first data is received
            document.getElementById('appWrapper').style.display = 'flex';

            if (data.status !== currentStatus) {
                currentStatus = data.status;
                if (data.status === 'live') {
                    startLive(data.videoId);
                } else if (data.status === 'resume') {
                    showResumeScreen();
                } else if (data.status === 'thanks') {
                    showThankYou();
                } else {
                    showWaitingScreen();
                }
            }
        });

    </script>
</body>

</html>
