<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ignite 2026 - Live Event</title>
    <!-- Premium Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #E8BA65;

            /* --- DESKTOP VARIABLES (LOCKED) --- */
            --logo-top: 16%;
            --logo-left: -0.5%;
            --logo-width: 940px;

            --logo-stream-top: 6%;
            --logo-stream-left: 0%;
            --logo-stream-width: 444px;

            --text-top: 54%;
            --text-left: 50%;
            --text-size: 3.5rem;

            --video-top: 22.5%;
            --video-left: 15%;
            --video-width: 70%;
            --video-height: 75.5%;

            /* --- MOBILE VARIABLES (ISOLATED) --- */
            --m-logo-top: 25%;
            --m-logo-width: 80%;
            --m-text-top: 65%;
            --m-text-size: 1.2rem;

            --m-video-top: 40%;
            --m-video-left: 5%;
            --m-video-width: 90%;
            --m-video-height: 25%;

            /* --- TABLET VARIABLES (NEW) --- */
            --t-logo-top: 20%;
            --t-logo-width: 70%;
            --t-text-top: 60%;
            --t-text-size: 2.5rem;
            --t-video-top: 40%;
            --t-video-left: 10%;

            --t-video-width: 80%;
            --t-video-height: 40%;
        }


        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
        }

        .background-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background-size: cover;
            background-position: center;
            transition: background-image 0.5s;
        }

        /* Desktop Layout */
        .branding-overlay {
            position: absolute;
            top: var(--logo-top);
            left: var(--logo-left);
            width: 100%;
            display: flex;
            justify-content: center;
            z-index: 10;
        }

        .branding-overlay.live-mode {
            top: var(--logo-stream-top);
            left: var(--logo-stream-left);
        }

        .event-logo {
            width: auto;
            max-width: var(--logo-width);
            height: auto;
            max-height: 250px;
        }

        .branding-overlay.live-mode .event-logo {
            max-width: var(--logo-stream-width);
        }

        .status-content {
            position: absolute;
            top: var(--text-top);
            left: var(--text-left);
            transform: translate(-50%, -50%);
            width: auto;
            text-align: center;
            z-index: 8;
            white-space: nowrap;
        }



        .status-text {
            font-size: var(--text-size);
            color: var(--text-color);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
        }


        .video-overlay {
            position: absolute;
            top: var(--video-top);
            left: var(--video-left);
            width: var(--video-width);
            height: var(--video-height);
            z-index: 5;
        }


        /* --- MOBILE MODE (Completely Separate) --- */
        @media (max-width: 768px) {
            body {
                overflow: auto;
                background: #000;
            }
            .background-container {
                height: 100vh;
                min-height: 600px;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: flex-start;
                padding-top: 60px;
                background-attachment: fixed;
            }

            .branding-overlay {
                position: relative !important;
                top: 0 !important;
                left: 0 !important;
                margin-bottom: 40px;
                width: 100%;
                display: flex;
                justify-content: center;
                z-index: 10;
            }

            .event-logo {
                max-width: 80% !important;
                max-height: 120px;
            }

            .video-overlay {
                position: relative !important;
                top: 0 !important;
                left: 0 !important;
                width: 95% !important;
                height: auto !important;
                aspect-ratio: 16 / 9;
                margin: 0 auto;
                box-shadow: 0 10px 40px rgba(0,0,0,0.8);
                border: 1px solid rgba(232, 186, 101, 0.3);
                border-radius: 8px;
                overflow: hidden;
            }

            .status-content {
                position: relative !important;
                top: 0 !important;
                left: 0 !important;
                width: 100% !important;
                transform: none !important;
                margin-top: 40px;
                padding: 0 20px;
                white-space: normal !important;
            }

            .status-text {
                font-size: 1.5rem !important;
                line-height: 1.4 !important;
                letter-spacing: 1px !important;
                text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            }
        }

        /* --- TABLET MODE (NEW) --- */
        @media (min-width: 769px) and (max-width: 1024px) {
            #mainBg {
                background-image: url('Images/Event will start 3pm.png') !important;
                /* Default desktop background for tablet */
                background-size: cover;
            }

            .branding-overlay {
                top: var(--t-logo-top) !important;
                left: 0 !important;
            }

            .event-logo {
                max-width: var(--t-logo-width) !important;
                max-height: 200px;
            }

            .status-content {
                top: var(--t-text-top) !important;
                left: 0 !important;
                width: 100% !important;
                transform: translateY(-50%) !important;
                white-space: normal !important;
            }

            .status-text {
                font-size: var(--t-text-size) !important;
                line-height: 1.4 !important;
            }

            .video-overlay {
                top: var(--t-video-top) !important;
                left: var(--t-video-left) !important;
                width: var(--t-video-width) !important;
                height: var(--t-video-height) !important;
            }
        }
    </style>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔥</text></svg>">
</head>

<body>
    <div id="appWrapper" style="display: flex;">
        <div id="mainBg" class="background-container" style="background-image: url('Images/thankyou for watching.png');">
            <div class="branding-overlay" id="logoWrap">
                <img src="Images/Truhome finance ignite logo.png" class="event-logo" alt="Ignite 2026">
            </div>
            <div id="statusContent" class="status-content" style="display: block;">
                <h1 id="statusText" class="status-text">THANK YOU FOR WATCHING</h1>
            </div>
            <div id="videoContainer" class="video-overlay">
                <!-- No active stream -->
            </div>
        </div>
    </div>

    <script type="module">

        const mainBg = document.getElementById('mainBg');
        const videoContainer = document.getElementById('videoContainer');
        const statusText = document.getElementById('statusText');
        const statusContent = document.getElementById('statusContent');
        const logoWrap = document.getElementById('logoWrap');

        function loadVideo(id) {
            if (!id) return;
            const isEv = id.toString().length < 9;
            const url = isEv ? `https://vimeo.com/event/${id}/embed/interaction` : `https://player.vimeo.com/video/${id}?autoplay=1&title=0&byline=0&portrait=0`;
            videoContainer.innerHTML = `<iframe src="${url}" allow="autoplay; fullscreen; picture-in-picture; encrypted-media; web-share" style="width:100%;height:100%;border:none;"></iframe>`;
        }

        function showWaiting() {
            mainBg.style.backgroundImage = "url('Images/Event will start 3pm.png')";
            statusContent.style.display = 'block'; logoWrap.classList.remove('live-mode'); videoContainer.innerHTML = '';
            statusText.innerText = "EVENT WILL START @3:00PM ON 11TH APRIL, 2026";
        }

        function startLive(id) {
            mainBg.style.backgroundImage = "url('Images/videostream.png')";
            statusContent.style.display = 'none'; 
            logoWrap.classList.add('live-mode'); 
            loadVideo(id);
        }

        function showThanks() {
            mainBg.style.backgroundImage = "url('Images/thankyou for watching.png')";
            statusContent.style.display = 'block'; logoWrap.classList.remove('live-mode'); videoContainer.innerHTML = '';
            statusText.innerText = "THANK YOU FOR WATCHING";
        }

        function showResume() {
            mainBg.style.backgroundImage = "url('Images/Stream will resume in 30 mins.png')";
            statusContent.style.display = 'block'; logoWrap.classList.remove('live-mode'); videoContainer.innerHTML = '';
            statusText.innerText = "STREAMING WILL RESUME IN 30 MINS";
        }

        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, push, onDisconnect, set, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        import { getAnalytics, logEvent } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-analytics.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB5tWsfjCTbh1KO5X2xZQeX2SwTZ9dJcs8",
            authDomain: "ignite2026-bf820.firebaseapp.com",
            databaseURL: "https://ignite2026-bf820-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "ignite2026-bf820",
            storageBucket: "ignite2026-bf820.firebasestorage.app",
            appId: "1:301380534120:web:0acad3ac76d4523d7a20dd",
            measurementId: "G-4GF6F6MG9H"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const analytics = getAnalytics(app);

        // Presence Logic - Background only, won't block UI if it fails
        const connectedRef = ref(db, ".info/connected");
        const viewersRef = ref(db, "viewers");
        
        onValue(connectedRef, (snap) => {
            if (snap.val() === true) {
                const myViewRef = push(viewersRef);
                onDisconnect(myViewRef).remove();
                set(myViewRef, { joinedAt: serverTimestamp() });
            }
        });

        // Firebase Status Listener - Disabled to ensure the "Forced Live" state is not overwritten
        /*
        const statusRef = ref(db, 'event/status');
        let curStatus = null;
        onValue(statusRef, (s) => {
             const d = s.val(); if (!d) return;
             if (d.status !== curStatus) {
                 curStatus = d.status;
                 if (d.status === 'live') startLive(d.videoId);
                 else if (d.status === 'resume') showResume();
                 else if (d.status === 'thanks') showThanks();
                 else showWaiting();
             }
        });
        */

    </script>
</body>

</html>
