<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ignite 2026 - Admin Dashboard</title>
    <style>
        :root {
            --primary: #ff5722;
            --secondary: #673ab7;
            --bg: #0a0a0c;
            --card-bg: #16161a;
            --text: #ffffff;
            --text-dim: #a0a0a0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .admin-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 500px;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.05);
        }

        h1 {
            font-size: 24px;
            margin-bottom: 8px;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: var(--text-dim);
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: var(--text-dim);
        }

        input {
            width: 100%;
            padding: 12px 16px;
            background: #25252b;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: white;
            font-size: 16px;
            outline: none;
            transition: border 0.3s;
        }

        input:focus {
            border-color: var(--primary);
        }

        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 20px;
        }

        button {
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        button span {
            font-size: 12px;
            opacity: 0.7;
            font-weight: 400;
        }

        .btn-waiting { background: #333; color: white; }
        .btn-live { background: var(--primary); color: white; }
        .btn-resume { background: #fb8c00; color: white; }
        .btn-thanks { background: var(--secondary); color: white; }

        button:hover {
            transform: translateY(-3px);
            filter: brightness(1.2);
        }

        .current-status {
            margin-bottom: 20px;
            padding: 10px;
            border-radius: 8px;
            background: rgba(76, 175, 80, 0.1);
            color: #4caf50;
            font-size: 13px;
            text-align: center;
            border: 1px solid rgba(76, 175, 80, 0.2);
        }
    </style>
</head>
<body>

    <div class="admin-card">
        <h1>Event Control Panel</h1>
        <p class="subtitle">Update the stream state for all devices instantly.</p>

        <div id="liveStatus" class="current-status">
            Connecting to Firebase...
        </div>

        <div class="form-group">
            <label>Vimeo Video ID (Required for Live)</label>
            <input type="text" id="videoId" placeholder="e.g. 1045236741" value="">
        </div>

        <label>Quick Actions</label>
        <div class="btn-grid">
            <button class="btn-waiting" id="btn-waiting">
                Set Waiting
                <span>Show Start Image</span>
            </button>
            <button class="btn-live" id="btn-live">
                Go Live
                <span>Show Video Stream</span>
            </button>
            <button class="btn-resume" id="btn-resume">
                Set Resume
                <span>Show 30m Message</span>
            </button>
            <button class="btn-thanks" id="btn-thanks">
                Show Thanks
                <span>End Stream</span>
            </button>
        </div>

        <p id="saveMessage" style="font-size: 12px; color: #4caf50; margin-top: 15px; text-align: center; display: none;">
            Status Updated Successfully!
        </p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB5tWsfjCTbh1KO5X2xZQeX2SwTZ9dJcs8",
            authDomain: "ignite2026-bf820.firebaseapp.com",
            databaseURL: "https://ignite2026-bf820-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "ignite2026-bf820",
            storageBucket: "ignite2026-bf820.firebasestorage.app",
            messagingSenderId: "301380534120",
            appId: "1:301380534120:web:0acad3ac76d4523d7a20dd"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const statusRef = ref(db, 'event/status');

        const videoInput = document.getElementById('videoId');
        const liveStatus = document.getElementById('liveStatus');
        const saveMessage = document.getElementById('saveMessage');

        async function updateStatus(status) {
            const videoId = videoInput.value;
            try {
                await set(statusRef, {
                    status: status,
                    videoId: status === 'live' ? videoId : ""
                });
                
                saveMessage.style.display = 'block';
                setTimeout(() => saveMessage.style.display = 'none', 3000);
            } catch (error) {
                alert("Error updating status: " + error.message);
            }
        }

        // Attach listeners
        document.getElementById('btn-waiting').onclick = () => updateStatus('waiting');
        document.getElementById('btn-live').onclick = () => updateStatus('live');
        document.getElementById('btn-resume').onclick = () => updateStatus('resume');
        document.getElementById('btn-thanks').onclick = () => updateStatus('thanks');

        // Monitor current status
        onValue(statusRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                liveStatus.innerText = "Current Status: " + data.status.toUpperCase() + (data.videoId ? " (" + data.videoId + ")" : "");
                if (data.videoId && !videoInput.value) videoInput.value = data.videoId;
            }
        });
    </script>
</body>
</html>
